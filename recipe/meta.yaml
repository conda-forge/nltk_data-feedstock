{% set version = "2026.07.01" %}
{% set commit = "550b6625bcef1f2abff2ff770a5a0d272c9c6b2a" %}

package:
  name: nltk_data
  version: {{ version }}

source:
  url: https://github.com/nltk/nltk_data/archive/{{ commit }}.tar.gz
  sha256: ab4c9d39fef45537e063ff4d1abc0b05f9b8ef9c1f91d1d64c711c06a849419b

build:
  number: 0

requirements:
  build:
    - unzip  # [unix]
    - 7za  # [win]
  run:
    - python
    - nltk >=3.4.4

about:
  home: https://www.nltk.org/
  license: Various
  # Apache-2.0 governs the repository as a whole, but each data package carries
  # its own terms, some of them restrictive; hence "Various" rather than an
  # SPDX expression. See LICENSE-OVERVIEW.md and DATASET-LICENSES.md.
  license_file:
    - LICENSE
    - LICENSE-OVERVIEW.md
    - DATASET-LICENSES.md
  summary: Data for the Natural Language Toolkit
  dev_url: https://github.com/nltk/nltk_data

extra:
  recipe-maintainers:
    - danielfrg
    - quartox
    - benhuff
    - mxr-conda
